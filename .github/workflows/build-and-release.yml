name: 'Build and Release'

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        required: false
        default: false
        type: boolean
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.package_version.outputs.version }}

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      WXT_UMAMI_WEBSITE_ID: ${{ vars.WXT_UMAMI_WEBSITE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm --filter extension exec playwright install --with-deps chromium

      - name: Get package version
        id: package_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Quality checkout
        run: pnpm exec turbo run typecheck lint test --affected

      - name: Run extension e2e tests
        run: xvfb-run -a pnpm test:e2e

      - name: Create zip artifacts
        run: pnpm run zip

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-chrome-v${{ steps.package_version.outputs.version }}
          path: apps/extension/.output/extension-${{ steps.package_version.outputs.version }}-chrome.zip
          retention-days: 30

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-firefox-v${{ steps.package_version.outputs.version }}
          path: apps/extension/.output/extension-${{ steps.package_version.outputs.version }}-firefox.zip
          retention-days: 30

      - name: List build outputs
        run: |
          echo "Build outputs:"
          ls -la apps/extension/.output/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Chrome artifact
        uses: actions/download-artifact@v4
        with:
          name: fast-track-chrome-v${{ needs.build.outputs.version }}
          path: ./artifacts/

      - name: Download Firefox artifact
        uses: actions/download-artifact@v4
        with:
          name: fast-track-firefox-v${{ needs.build.outputs.version }}
          path: ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          name: Fast Track v${{ needs.build.outputs.version }}
          body: |
            ## Fast Track v${{ needs.build.outputs.version }}

            ### Downloads
            - **Chrome Extension**: `fast-track-chrome-v${{ needs.build.outputs.version }}.zip`
            - **Firefox Extension**: `fast-track-firefox-v${{ needs.build.outputs.version }}.zip`

            ### Installation
            1. Download the appropriate zip file for your browser
            2. Extract the contents
            3. Load as unpacked extension in developer mode

            Built from commit: ${{ github.sha }}
          files: |
            artifacts/*.zip
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, 'alpha') || contains(needs.build.outputs.version, 'beta') || contains(needs.build.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
