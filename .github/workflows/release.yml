name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create GitHub release or publish to stores
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  WXT_UMAMI_WEBSITE_ID: ${{ vars.WXT_UMAMI_WEBSITE_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-release-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-turbo-release-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-release-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint, typecheck and unit tests
        run: pnpm exec turbo run lint typecheck test --continue=never

  package:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      version: ${{ steps.package_version.outputs.version }}
      is_beta: ${{ steps.release_type.outputs.is_beta }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-release-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-turbo-release-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-release-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm --filter extension exec playwright install --with-deps chromium

      - name: Run extension e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/extension/playwright-report/
          retention-days: 30

      - name: Get package version
        id: package_version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Detect release type
        id: release_type
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v*-beta.* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create zip artifacts
        run: pnpm run zip

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-chrome-v${{ steps.package_version.outputs.version }}${{ steps.release_type.outputs.is_beta == 'true' && '-beta' || '' }}
          path: apps/extension/.output/extension-${{ steps.package_version.outputs.version }}-chrome.zip
          retention-days: 30

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-track-firefox-v${{ steps.package_version.outputs.version }}${{ steps.release_type.outputs.is_beta == 'true' && '-beta' || '' }}
          path: apps/extension/.output/extension-${{ steps.package_version.outputs.version }}-firefox.zip
          retention-days: 30

  publish:
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: fast-track-*
          path: ./artifacts/
          merge-multiple: true

      - name: Browser Platform Publish (Stable)
        if: needs.package.outputs.is_beta != 'true'
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          chrome-file: ./artifacts/extension-${{ needs.package.outputs.version }}-chrome.zip
          firefox-file: ./artifacts/extension-${{ needs.package.outputs.version }}-firefox.zip

      - name: Create GitHub Release (Beta)
        if: needs.package.outputs.is_beta == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/extension-${{ needs.package.outputs.version }}-chrome.zip
            ./artifacts/extension-${{ needs.package.outputs.version }}-firefox.zip
          prerelease: true
          generate_release_notes: true
          name: ${{ needs.package.outputs.version }} (Beta)
